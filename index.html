<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Mali</title>
<meta name="description" content="Six cards, six answers.">
<meta name="theme-color" content="#F2E9DA">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Caveat:wght@400..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128140;</text></svg>">
</head>
<body>

<div class="korn" aria-hidden="true"></div>

<div class="start" id="start">
  <video class="start__video" id="start-video" playsinline muted autoplay preload="auto"></video>
  <p class="start__hinweis" id="start-hinweis"></p>
</div>
<div class="konfetti" id="konfetti" aria-hidden="true"></div>

<header class="kopf">
  <p class="kopf__gruss" id="kopf-gruss">For you</p>
  <h1 class="kopf__titel" id="kopf-titel"></h1>
  <p class="kopf__unter" id="kopf-unter"></p>

  <div class="fortschritt">
    <div class="fortschritt__balken"><i id="balken" style="--p:0"></i></div>
    <p class="fortschritt__text"><span id="zaehler">0</span> of <span id="gesamt">0</span> opened</p>
  </div>
</header>

<main>
  <section class="gitter" id="gitter" aria-label="Cards"></section>
</main>

<div class="streu" id="streu" aria-hidden="true"></div>

<section class="gruende" id="gruende">
  <p class="gruende__zahl" aria-hidden="true">50</p>
  <h2 class="gruende__titel" id="gruende-titel"></h2>
  <p class="gruende__unter" id="gruende-unter"></p>
  <ol class="gruende__liste" id="gruende-liste"></ol>
</section>

<section class="brief" id="brief" hidden>
  <div class="brief__siegel" aria-hidden="true">&#9829;</div>
  <h2 class="brief__titel" id="brief-titel"></h2>
  <p class="brief__text" id="brief-text"></p>
  <p class="brief__signatur" id="brief-signatur"></p>
</section>

<audio id="musik-quelle" loop preload="auto"></audio>

<footer class="fuss">
  <p class="fuss__notiz" id="fuss-notiz"></p>
</footer>

<script src="assets/inhalte.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
